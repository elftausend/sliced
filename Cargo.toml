 [package]
name = "sliced"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
#custos = { git = "https://github.com/elftausend/custos", branch = "autograd" }
#custos = {git = "https://github.com/elftausend/custos", branch = "autograd", default-features=false, features=["macro"]}
rawsliced = { path = "../rawsliced", default-features = false }
custos = {path = "../custos", default-features=false, features=["macro"]}
fastrand = { version = "1.8.0", optional = true }

[profile.release]
debug = true

[features]
default = ["no-std", "matrix", "half", "blas"]
# default = ["cpu",  "matrix", "opencl", "stack", "autograd"]
#default = ["blas", "stack", "cpu", "matrix", "opencl", "autograd"]
#default = ["stack", "cpu", "opencl", "blas", "matrix", "static-api"]

std = []
no-std = ["stack", "custos/no-std"]

autograd = ["custos/autograd", "std"]
static-api = ["custos/static-api", "cpu"]
stack = ["custos/stack"]
cpu = ["custos/cpu", "std", "dep:fastrand"]
opencl = ["custos/opencl", "cpu", "std"]
blas = ["custos/blas"]
half = ["custos/half"]
matrix = ["cpu", "autograd"]
#nnapi = ["custos/nnapi"]

[dev-dependencies]
graplot = "0.1.22"
purpur = "0.1.0"

[[test]]
name = "test_combination"
required-features = ["cpu", "autograd", "opencl"]

